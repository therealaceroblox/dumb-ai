<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dumb AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chatbox {
      width: 350px;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 15px;
    }

    .messages {
      height: 250px;
      overflow-y: auto;
      background: #000;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .user {
      color: #4fc3f7;
      margin-bottom: 5px;
    }

    .bot {
      color: #ff5252;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: none;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="chatbox">
    <h3>Dumb AI 🤖</h3>
    <div class="messages" id="messages"></div>
    <input type="text" id="input" placeholder="Say something dumb..." />
  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");

    const dumbResponses = [
      "I have no idea what you just said.",
      "That sounds like a unicorn problem.",
      "oh no i guess. Brain empty.",
      "I asked my brain and it said no.",
      "Yes. Or maybe no. Probably potato.",
      "I would answer, but I forgot how.",
      "Interesting... but also not.",
      "I am 3% sure that is wrong.",
      "Error 404: Intelligence not found."
    ];

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && input.value.trim() !== "") {
        const userText = input.value;

        messages.innerHTML += `<div class="user">You: ${userText}</div>`;

        const randomReply =
          dumbResponses[Math.floor(Math.random() * dumbResponses.length)];

        setTimeout(() => {
          messages.innerHTML += `<div class="bot">Dumb AI: ${randomReply}</div>`;
          messages.scrollTop = messages.scrollHeight;
        }, 500);

        input.value = "";
      }
    });
  </script>

</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dumb AI + Brainrot AI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: #0b0b0b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    button {
      padding: 20px 40px;
      font-size: 18px;
      background: #ff3b3b;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 20px #ff3b3b66;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px #ff3b3b99;
    }

    .chatbox {
      width: 90%;
      max-width: 400px;
      background: #1a1a1a;
      border: 2px solid #ff3b3b;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 0 20px #ff3b3b66;
      display: flex;
      flex-direction: column;
      display: none; /* Hidden initially */
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #ff3b3b;
      text-shadow: 0 0 8px #ff3b3b66;
    }

    .messages {
      flex: 1;
      background: #0d0d0d;
      border-radius: 10px;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
      margin-bottom: 10px;
      box-shadow: inset 0 0 10px #ff3b3b33;
    }

    .user {
      color: #4fc3f7;
      margin-bottom: 5px;
      animation: fadeIn 0.3s;
    }

    .bot {
      color: #ff3b3b;
      margin-bottom: 10px;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 14px;
      background: #1a1a1a;
      color: white;
      border: 1px solid #ff3b3b;
      box-shadow: 0 0 5px #ff3b3b33;
    }

    input::placeholder {
      color: #888;
    }

    @media screen and (max-width: 500px) {
      .chatbox {
        width: 95%;
        padding: 10px;
      }
      button {
        width: 80%;
      }
    }
  </style>
</head>
<body>

  <!-- BUTTON SCREEN -->
  <button id="startBtn">Enter Brainrot AI</button>

  <!-- CHATBOX SCREEN -->
  <div class="chatbox" id="chatbox">
    <h2>Brainrot AI 🤯</h2>
    <div class="messages" id="messages"></div>
    <input type="text" id="input" placeholder="Say something insane..." />
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const chatbox = document.getElementById("chatbox");
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");

    // CRAZY BRAINROT RESPONSES
    const brainrotResponses = [
      "oMg bro your IQ just fell into a pit of spaghetti 🍝",
      "my neurons are doing the cha-cha on acid 🤪",
      "yes and also the toaster is plotting against us",
      "banana banana brain melt 🧠💥",
      "all your thoughts are now a single confused potato 🥔",
      "I just inhaled your logic and it exploded 🤯",
      "what if the sky was actually a pancake? 🥞",
      "ERROR: reality.exe has stopped making sense",
      "my brain just teleported to another dimension without permission",
      "you’re thinking too hard, I ate your thought for breakfast"
    ];

    // SHOW CHATBOX WHEN BUTTON CLICKED
    startBtn.addEventListener("click", () => {
      startBtn.style.display = "none"; // hide button
      chatbox.style.display = "flex"; // show AI chatbox
    });

    // SEND MESSAGE FUNCTION
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter" && input.value.trim() !== "") {
        const userText = input.value;
        messages.innerHTML += `<div class="user">You: ${userText}</div>`;

        const randomReply = brainrotResponses[Math.floor(Math.random() * brainrotResponses.length)];

        setTimeout(() => {
          messages.innerHTML += `<div class="bot">Brainrot AI: ${randomReply}</div>`;
          messages.scrollTop = messages.scrollHeight;
        }, 500);

        input.value = "";
      }
    });
  </script>

</body>
</html>
